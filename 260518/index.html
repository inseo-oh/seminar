<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>숨은 단어 찾기 게임 - 좌표 완벽 수정 버전</title>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <link rel="stylesheet" href="index.css" />
    </head>
    <body>
        <div id="container"></div>
        <div id="wrap">
            <div class="main-wrapper" id="wordGame">
                <div class="game-header">
                    <div class="header-title-box">
                        <span class="badge-blue">대단원 끝맺기</span>
                        <h1 class="main-title">개념 확인하기</h1>
                    </div>
                    <div class="instruction-text">※ 정답 낱말을 찾아 글자를 차례로 클릭해 보세요.</div>
                </div>

                <div class="guide-intro">
                    다음 문제의 □안에 들어갈 용어를 퍼즐에서 가로, 세로, 대각선으로 찾아 동그라미로 표시해
                    보자.
                </div>

                <div class="game-content">
                    <div class="left-panel">
                        <div class="grid-wrapper">
                            <div class="table-relative-box">
                                <table class="word-table">
                                    <tbody class="js-grid-body"></tbody>
                                </table>
                                <svg class="svg-overlay js-svg-overlay">
                                    <g class="js-hint-group"></g>
                                    <g class="js-found-group"></g>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <div class="right-panel">
                        <div class="question-box">
                            <div class="question-number js-q-num">0</div>
                            <div class="question-text js-q-text">문제를 불러오는 중입니다...</div>
                        </div>
                        <div class="control-box">
                            <button class="reset-btn js-reset-btn">⟳ 다시 하기</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
        <script src="popscale.js"></script>
    </body>
</html>
