<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>숨은 단어 찾기 게임 - 좌표 완벽 수정 버전</title>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
                background-color: #eef2f5;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                padding: 20px;
            }

            /* 메인 전체 외곽 컨테이너 */
            .main-wrapper {
                width: 1000px;
                background: #ffffff;
                border-radius: 32px;
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.05);
                padding: 35px 40px;
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            /* 상단 타이틀 영역 스타일 */
            .game-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid #e2e8f0;
                padding-bottom: 15px;
            }
            .header-title-box {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .badge-blue {
                background-color: #3b82f6;
                color: #ffffff;
                font-weight: bold;
                font-size: 14px;
                padding: 6px 16px;
                border-radius: 20px;
            }
            .main-title {
                font-size: 24px;
                font-weight: 800;
                color: #1e293b;
            }
            .instruction-text {
                font-size: 15px;
                color: #ef4444;
                font-weight: 600;
            }

            /* 가이드 지문 영역 */
            .guide-intro {
                font-size: 18px;
                color: #334155;
                font-weight: bold;
                line-height: 1.5;
                margin-bottom: 5px;
            }

            /* 콘텐츠 배치 영역 (좌/우) */
            .game-content {
                display: flex;
                gap: 40px;
                align-items: flex-start;
            }

            /* 좌측 영역: 단어 판 */
            .left-panel {
                flex: 1.1;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            /* 주황색 테두리 역할만 수행하는 배경 박스 */
            .grid-wrapper {
                background-color: #f3cda2;
                padding: 8px;
                border-radius: 12px;
                display: inline-block;
            }

            /* [핵심 수정] 테이블과 SVG를 1:1 크기로 묶어주는 기준점 박스 */
            .table-relative-box {
                position: relative;
                display: block;
            }

            /* 단어 판 테이블 스타일 */
            .word-table {
                border-collapse: collapse;
                user-select: none;
                background-color: #ffffff;
            }
            .word-table td {
                width: 52px;
                height: 52px;
                border: 2px solid #f3cda2;
                text-align: center;
                font-size: 20px;
                font-weight: bold;
                color: #2d3748;
                cursor: pointer;
                transition: background-color 0.2s;
            }
            /* 글자가 선택되어 켜졌을 때 스타일 (임시 피드백) */
            .word-table td.is-lit {
                background-color: #fff1f2;
                color: #f43f5e;
            }

            /* [핵심 수정] 이제 테이블 박스 크기와 정확히 일치하게 오버레이됨 */
            .svg-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 10;
                overflow: visible;
            }

            /* 우측 영역: 문제 및 제어 */
            .right-panel {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 25px;
            }

            /* 우측 중앙: 교재 스타일의 파스텔 블루 문제 상자 */
            .question-box {
                background-color: #eaf4f7;
                border-radius: 16px;
                padding: 30px;
                position: relative;
                min-height: 220px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            /* 문제 번호 배지 */
            .question-number {
                position: absolute;
                top: -15px;
                left: 20px;
                background-color: #87b9c7;
                color: #ffffff;
                font-size: 18px;
                font-weight: bold;
                padding: 4px 18px;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            }
            .question-text {
                font-size: 20px;
                color: #2d3748;
                font-weight: bold;
                line-height: 1.7;
                word-break: keep-all;
                margin-top: 10px;
            }

            /* 우측 하단: 제어 상자 */
            .control-box {
                display: flex;
                justify-content: flex-end;
            }
            /* 다시하기 하늘색 알약 버튼 */
            .reset-btn {
                padding: 12px 32px;
                font-size: 16px;
                font-weight: bold;
                color: #ffffff;
                background-color: #52bccc;
                border: none;
                border-radius: 50px;
                cursor: pointer;
                box-shadow: 0 4px 12px rgba(82, 188, 204, 0.3);
                transition: all 0.2s;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .reset-btn:hover {
                background-color: #43aab9;
                transform: translateY(-1px);
            }
        </style>
    </head>
    <body>
        <div class="main-wrapper" id="wordGame">
            <div class="game-header">
                <div class="header-title-box">
                    <span class="badge-blue">대단원 끝맺기</span>
                    <h1 class="main-title">개념 확인하기</h1>
                </div>
                <div class="instruction-text">※ 정답 낱말을 찾아 글자를 차례로 클릭해 보세요.</div>
            </div>

            <div class="guide-intro">
                다음 문제의 □안에 들어갈 용어를 퍼즐에서 가로, 세로, 대각선으로 찾아 동그라미로 표시해 보자.
            </div>

            <div class="game-content">
                <div class="left-panel">
                    <div class="grid-wrapper">
                        <div class="table-relative-box">
                            <table class="word-table">
                                <tbody class="js-grid-body"></tbody>
                            </table>
                            <svg class="svg-overlay js-svg-overlay">
                                <g class="js-hint-group"></g>
                                <g class="js-found-group"></g>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="right-panel">
                    <div class="question-box">
                        <div class="question-number js-q-num">0</div>
                        <div class="question-text js-q-text">문제를 불러오는 중입니다...</div>
                    </div>
                    <div class="control-box">
                        <button class="reset-btn js-reset-btn">⟳ 다시 하기</button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // ==========================================
            // ES5 형태의 숨은 단어 찾기 게임 로직 클래스
            // ==========================================
            function WordSearchGame(elementId, gameConfig) {
                this.$el = $(elementId);
                this.gridConfig = {
                    size: gameConfig.gridSize,
                    letters: gameConfig.gridLetters,
                };
                this.questions = gameConfig.questions;

                this.currentIdx = 0;
                this.currentQuestion = null;
                this.isTestMode = false;

                this.init();
            }

            WordSearchGame.prototype.init = function () {
                var self = this;
                this.renderStaticGrid();

                this.$el.find('.js-reset-btn').on('click', function () {
                    self.loadQuestion(self.currentIdx);
                });

                this.loadQuestion(this.currentIdx);
            };

            WordSearchGame.prototype.renderStaticGrid = function () {
                var self = this;
                var $tbody = this.$el.find('.js-grid-body').empty();

                for (var r = 0; r < this.gridConfig.size.rows; r++) {
                    var $tr = $('<tr></tr>');
                    for (var c = 0; c < this.gridConfig.size.cols; c++) {
                        var letter = this.gridConfig.letters[r][c] || '';
                        var $td = $('<td></td>').text(letter).attr('data-row', r).attr('data-col', c);

                        $td.on('click', function () {
                            self.handleCellClick($(this));
                        });

                        $tr.append($td);
                    }
                    $tbody.append($tr);
                }
            };

            WordSearchGame.prototype.loadQuestion = function (index) {
                if (index >= this.questions.length) {
                    this.currentIdx = 0;
                    index = 0;
                }

                this.currentIdx = index;
                this.currentQuestion = $.extend(true, {}, this.questions[index]);

                this.currentQuestion.words.forEach(function (word) {
                    word.found = false;
                    word.clickedIndices = [];
                });

                this.$el.find('.js-grid-body td').removeClass('is-lit');
                this.$el.find('.js-hint-group').empty();
                this.$el.find('.js-found-group').empty();

                this.$el.find('.js-q-num').text(this.currentQuestion.questionNum);
                this.$el.find('.js-q-text').html(this.currentQuestion.questionText);

                if (this.isTestMode) {
                    this.showTestHints();
                }
            };

            WordSearchGame.prototype.handleCellClick = function ($cell) {
                var self = this;

                if ($cell.hasClass('is-lit')) {
                    return;
                }

                var row = parseInt($cell.attr('data-row'), 10);
                var col = parseInt($cell.attr('data-col'), 10);
                var matched = false;
                var completedWords = [];

                this.currentQuestion.words.forEach(function (word) {
                    if (word.found) return;

                    var idx = -1;
                    for (var i = 0; i < word.cells.length; i++) {
                        if (word.cells[i].r === row && word.cells[i].c === col) {
                            idx = i;
                            break;
                        }
                    }

                    if (idx !== -1) {
                        matched = true;
                        if (word.clickedIndices.indexOf(idx) === -1) {
                            word.clickedIndices.push(idx);
                        }
                        if (word.clickedIndices.length === word.cells.length) {
                            completedWords.push(word);
                        }
                    }
                });

                if (matched) {
                    $cell.addClass('is-lit');

                    completedWords.forEach(function (word) {
                        word.found = true;
                        self.drawEllipseForWord(word);

                        word.cells.forEach(function (cell) {
                            var $c = self.getCellElement(cell.r, cell.c);
                            $c.removeClass('is-lit');
                        });
                    });

                    if (this.isTestMode) {
                        this.showTestHints();
                    }

                    var isAllCleared = this.currentQuestion.words.every(function (w) {
                        return w.found;
                    });
                    if (isAllCleared) {
                        this.playSuccessSound();
                        setTimeout(function () {
                            self.loadQuestion(self.currentIdx + 1);
                        }, 600);
                    }
                } else {
                    this.playFailureSound();
                }
            };

            WordSearchGame.prototype.getCellElement = function (row, col) {
                return this.$el.find('.js-grid-body tr').eq(row).find('td').eq(col);
            };

            // 공통 타원 드로잉 메소드 (이제 .table-relative-box가 offsetParent가 되므로 완벽히 1:1 매칭됨)
            WordSearchGame.prototype.drawBaseEllipse = function (word, targetContainer, styleAttrs) {
                var $targetLayer = this.$el.find('.js-svg-overlay').find(targetContainer);

                var startCell = this.getCellElement(word.cells[0].r, word.cells[0].c);
                var endCell = this.getCellElement(
                    word.cells[word.cells.length - 1].r,
                    word.cells[word.cells.length - 1].c
                );

                var pos1 = startCell.position();
                var pos2 = endCell.position();

                var w1 = startCell.outerWidth();
                var h1 = startCell.outerHeight();

                var x1 = pos1.left + w1 / 2;
                var y1 = pos1.top + h1 / 2;
                var x2 = pos2.left + w1 / 2;
                var y2 = pos2.top + h1 / 2;

                var cx = (x1 + x2) / 2;
                var cy = (y1 + y2) / 2;

                var dx = x2 - x1;
                var dy = y2 - y1;
                var distance = Math.sqrt(dx * dx + dy * dy);

                var rx = (distance + w1 * 0.78) / 2;
                var ry = h1 * 0.44;
                var angle = (Math.atan2(dy, dx) * 180) / Math.PI;

                var ellipse = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
                ellipse.setAttribute('cx', cx);
                ellipse.setAttribute('cy', cy);
                ellipse.setAttribute('rx', rx);
                ellipse.setAttribute('ry', ry);
                ellipse.setAttribute('transform', 'rotate(' + angle + ' ' + cx + ' ' + cy + ')');

                Object.keys(styleAttrs).forEach(function (key) {
                    ellipse.setAttribute(key, styleAttrs[key]);
                });

                $targetLayer.append(ellipse);
            };

            // 정답을 찾았을 때 교재 스타일의 핑크 실선 타원 그리기
            WordSearchGame.prototype.drawEllipseForWord = function (word) {
                var successStyles = {
                    stroke: '#ff007f',
                    'stroke-width': '4',
                    fill: 'rgba(255, 0, 127, 0.08)',
                };
                this.drawBaseEllipse(word, '.js-found-group', successStyles);
            };

            // 콘솔 전용 테스트 모드 정답 힌트 (연한 푸른색 점선 타원으로 표시)
            WordSearchGame.prototype.showTestHints = function () {
                var self = this;
                this.$el.find('.js-hint-group').empty();

                var hintStyles = {
                    stroke: '#3182ce',
                    'stroke-width': '3',
                    'stroke-dasharray': '6,4',
                    fill: 'none',
                };

                this.currentQuestion.words.forEach(function (word) {
                    if (!word.found) {
                        self.drawBaseEllipse(word, '.js-hint-group', hintStyles);
                    }
                });
            };

            WordSearchGame.prototype.clearTestHints = function () {
                this.$el.find('.js-hint-group').empty();
            };

            // 콘솔 호출 인터페이스용 토글 함수
            WordSearchGame.prototype.toggleTestMode = function () {
                this.isTestMode = !this.isTestMode;
                if (this.isTestMode) {
                    console.log(
                        '%c[WordGame] 테스트 힌트가 켜졌습니다.',
                        'color: #3182ce; font-weight: bold;'
                    );
                    this.showTestHints();
                } else {
                    console.log(
                        '%c[WordGame] 테스트 힌트가 꺼졌습니다.',
                        'color: #ef4444; font-weight: bold;'
                    );
                    this.clearTestHints();
                }
            };

            // 사운드 관련 Web Audio API
            WordSearchGame.prototype.playSuccessSound = function () {
                try {
                    var AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContext) return;
                    var ctx = new AudioContext(),
                        now = ctx.currentTime,
                        osc = ctx.createOscillator(),
                        gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(783.99, now + 0.1);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } catch (e) {}
            };

            WordSearchGame.prototype.playFailureSound = function () {
                try {
                    var AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContext) return;
                    var ctx = new AudioContext(),
                        now = ctx.currentTime,
                        osc = ctx.createOscillator(),
                        gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(130, now + 0.15);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } catch (e) {}
            };

            // ==========================================
            // 교재와 동일한 8x8 고정 단어판 데이터 구성
            // ==========================================
            var globalGameConfig = {
                gridSize: { rows: 8, cols: 8 },
                gridLetters: [
                    ['자', '규', '국', '민', '건', '강', '보', '험'],
                    ['원', '범', '의', '료', '강', '실', '호', '우'],
                    ['비', '대', '면', '최', '도', '천', '기', '상'],
                    ['연', '옹', '호', '고', '시', '후', '관', '행'],
                    ['관', '련', '성', '복', '시', '민', '활', '동'],
                    ['민', '주', '시', '민', '대', '수', '용', '감'],
                    ['원', '생', '태', '양', '응', '문', '광', '수'],
                    ['격', '탄', '소', '중', '립', '화', '로', '성'],
                ],
                questions: [
                    {
                        questionNum: 3,
                        questionText:
                            '건강권 구현을 위한 건강자원의 평가 기준에는 이용 가능성, 접근 가능성, □□ 가능성, 질적 우수성이 있다.',
                        words: [
                            {
                                text: '수용',
                                cells: [
                                    { r: 5, c: 5 },
                                    { r: 5, c: 6 },
                                ],
                            },
                            {
                                text: '관련성',
                                cells: [
                                    { r: 4, c: 0 },
                                    { r: 4, c: 1 },
                                    { r: 4, c: 2 },
                                ],
                            },
                            {
                                text: '최고',
                                cells: [
                                    { r: 2, c: 3 },
                                    { r: 3, c: 3 },
                                ],
                            },
                        ],
                    },
                ],
            };

            $(document).ready(function () {
                var wordGameInstance = new WordSearchGame('#wordGame', globalGameConfig);
                window.toggleTestMode = function () {
                    if (wordGameInstance) wordGameInstance.toggleTestMode();
                };
            });
        </script>
    </body>
</html>
